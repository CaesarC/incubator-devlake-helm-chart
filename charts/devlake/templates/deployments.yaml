---
# devlake-ui
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devlake.fullname" . }}-ui
  labels:
    {{- include "devlake.labels" . | nindent 4 }}
    {{- with .Values.ui.deployment.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  {{- with .Values.ui.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devlake.selectorLabels" . | nindent 6 }}
      devlakeComponent: ui
  template:
    metadata:
      labels:
        {{- include "devlake.selectorLabels" . | nindent 8 }}
        devlakeComponent: ui
        {{- with .Values.ui.extraLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml .Values.ui.podAnnotations | nindent 8 }}
    spec:
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      {{- include "common.podSecurityContext" .Values.ui | nindent 6 }}
      containers:
      {{- with .Values.ui.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
        - name: config-ui
          {{- include "common.image" (dict "component" .Values.ui "defaultTag" .Values.imageTag) | nindent 10 }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 4000
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.basicAuth.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "devlake.ui.auth.secret" . }}
          {{- end }}
          env:
            - name: DEVLAKE_ENDPOINT
              value: {{ include "devlake.fullname" . }}-lake.{{ .Release.Namespace }}.svc.cluster.local:8080
{{- if not .Values.grafana.enabled }}
            - name: GRAFANA_ENDPOINT
              value: {{ .Values.grafana.external.url }}
            - name: USE_EXTERNAL_GRAFANA
              value: "true"
{{- else }}
            - name: GRAFANA_ENDPOINT
              value: {{ .Release.Name }}-grafana.{{ .Release.Namespace }}.svc.cluster.local:80
{{- end }}
            {{- include "common.envs" . | nindent 12 }}
          {{- include "common.resources" .Values.ui | nindent 10 }}
          {{- include "common.containerSecurityContext" .Values.ui | nindent 10 }}
      {{- include "common.nodeSelector" .Values.ui | nindent 6 }}
      {{- include "common.affinity" .Values.ui | nindent 6 }}
      {{- include "common.tolerations" .Values.ui | nindent 6 }}

---
# devlake
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devlake.fullname" . }}-lake
  labels:
  {{- include "devlake.labels" . | nindent 4 }}
  {{- with .Values.lake.deployment.extraLabels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  {{- with .Values.lake.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devlake.selectorLabels" . | nindent 6 }}
      devlakeComponent: lake
  template:
    metadata:
      labels:
        {{- include "devlake.selectorLabels" . | nindent 8 }}
        devlakeComponent: lake
        {{- with .Values.lake.extraLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        {{- toYaml .Values.lake.podAnnotations | nindent 8 }}
    spec:
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      {{- include "common.podSecurityContext" .Values.lake | nindent 6 }}
      initContainers:
        {{- include "common.initContainerWaitDatabase" . | nindent 8 }}
        {{- with .Values.lake.containerSecurityContext }}
          securityContext:
          {{- toYaml . | nindent 12 }}
      {{- end }}
      containers:
        - name: lake
          {{- include "common.image" (dict "component" .Values.lake "defaultTag" .Values.imageTag) | nindent 10 }}
          imagePullPolicy: {{ .Values.lake.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.lake.port }}
          {{- with .Values.lake.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lake.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "devlake.mysql.secret" . }}
            - secretRef:
                name: {{ include "devlake.lake.encryption.secret" . }}
            {{- if .Values.lake.extraEnvsFromSecret }}
            - secretRef:
                name: {{ .Values.lake.extraEnvsFromSecret }}
            {{- end }}
          env:
            - name: PORT
              value: "{{ .Values.lake.port }}"
            {{- range $key1, $value1 := .Values.lake.envs }}
            - name: "{{ tpl $key1 $ }}"
              value: "{{ tpl (print $value1) $ }}"
            {{- end }}
            {{- range $key2, $value2 := .Values.commonEnvs }}
            - name: "{{ tpl $key2 $ }}"
              value: "{{ tpl (print $value2) $ }}"
            {{- end }}
          {{- include "common.resources" .Values.lake | nindent 10 }}
          {{- if .Values.lake.volumeMounts }}
          volumeMounts:
            {{- range $volumeMount := .Values.lake.volumeMounts }}
            - {{- $volumeMount | toYaml | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- include "common.containerSecurityContext" .Values.lake | nindent 10 }}
      {{- if .Values.lake.volumes }}
      volumes:
        {{- range $volume := .Values.lake.volumes }}
        - {{- $volume | toYaml | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if .Values.lake.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "common.nodeSelector" .Values.lake | nindent 6 }}
      {{- include "common.affinity" .Values.lake | nindent 6 }}
      {{- include "common.tolerations" .Values.lake | nindent 6 }}


